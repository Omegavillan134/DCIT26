<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARALYSIS</title>

    <!-- UNICONS CDN -->
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Catamaran:wght@100;300;500;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./quiz.css">
</head>
<body>


    <!-- Quizzes -->
    <section class="quiz__section">
        <div class="container quiz__container">
            <div class="quiz__box">
                <h1 class="quiz__main-title">QUIZ</h1>
                <p class="quiz__subtitle">choose the content of the quiz</p>

                <form id="quizForm">
                    <ul class="quiz__list">
                        <li class="quiz__item">
                            <label>
                                <input type="checkbox" name="Lesson" value="Lesson 1">
                                <span>LESSON 1 | Glimpse at Emerging Technologies</span>
                            </label>
                        </li>
                        <li class="quiz__item">
                            <label>
                                <input type="checkbox" name="Lesson" value="Lesson 2">
                                <span>LESSON 2 | Introduction to C++ Programming</span>
                            </label>
                        </li>
                        <li class="quiz__item">
                            <label>
                                <input type="checkbox" name="Lesson" value="Lesson 3">
                                <span>LESSON 3 | C++ Basics</span>
                            </label>
                        </li>
                        <li class="quiz__item">
                            <label>
                                <input type="checkbox" name="Lesson" value="Lesson 4">
                                <span>LESSON 4 | C++ Logic</span>
                            </label>
                        </li>
                        <li class="quiz__item">
                            <label>
                                <input type="checkbox" name="Lesson" value="Lesson 5">
                                <span>LESSON 5 | Functions & Debugging in C++</span>
                            </label>
                        </li>
                        <li class="quiz__item">
                            <label>
                                <input type="checkbox" name="Lesson" value="Lesson 6">
                                <span>LESSON 6 | Arduino Fundamentals</span>
                            </label>
                        </li>
                        <li class="quiz__item">
                            <label>
                                <input type="checkbox" name="Lesson" value="Lesson 7">
                                <span>LESSON 7 | Ethics, Privacy, and Security</span>
                            </label>
                        </li>
                    </ul>

                    <div class="quiz__btn-container">
                        <button type="button" id="takeQuizBtn" class="btn btn-primary take-quiz-btn">Take Quiz<i class="uil uil-angle-right"></i></button>
                    </div>

                    <div id="quizQuestionsContainer" style="margin-top: 2rem;"></div>
                </form>
            </div>
        </div>
    </section>

        <div id="quizModal" class="modal__overlay">
            <div class="modal__content">
                <button id="closeModalBtn" class="modal__close"><i class="uil uil-multiply"></i></button>
                <h3>choose your preferred type of quiz</h3>

                <div class="modal__options">
                    <a href="#" class="modal__option-btn" onclick="startQuiz('identification')">
                        <i class="uil uil-question-circle" style="color: #f59e0b"></i>
                        <span>Identification</span>
                    </a>

                    <a href="#" class="modal__option-btn" onclick="startQuiz('multiple-choice')">
                        <i class="uil uil-list-ui-alt" style="color: #3b82f6"></i>
                        <span>Multiple Choice</span>
                    </a>
                </div>
            </div>
        </div>

    <script src="./questions.js"></script>
    <script src="./script.js"></script>
</body>
</html>
